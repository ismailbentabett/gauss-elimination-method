<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Gauss Elimination banner">
  <title>Gauss Elimination</title>
  <defs>
    <clipPath id="frame">
      <rect width="1280" height="400" rx="24"/>
    </clipPath>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64748B" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#64748B" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#FFFFFF"/>
    </pattern>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.35">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="#0B0F19"/>
    <rect width="1280" height="400" fill="url(#wash)"/>
    <rect width="1280" height="400" fill="url(#dots)" opacity="0.06"/>
    <rect width="1280" height="400" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <g transform="translate(96 72) scale(0.9765625)">
    <rect width="256" height="256" rx="56" fill="url(#tile)"/>
    <rect width="256" height="128" rx="56" fill="url(#shine)"/>
    <path d="M84 60H62v136h22" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M172 60h22v136h-22" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="98" cy="94" r="10" fill="#FFFFFF"/>
    <circle cx="128" cy="94" r="10" fill="#FFFFFF"/>
    <circle cx="158" cy="94" r="10" fill="#FFFFFF"/>
    <circle cx="128" cy="128" r="10" fill="#FFFFFF"/>
    <circle cx="158" cy="128" r="10" fill="#FFFFFF"/>
    <circle cx="158" cy="162" r="10" fill="#FFFFFF"/>
    <circle cx="98" cy="128" r="5" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="98" cy="162" r="5" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="128" cy="162" r="5" fill="#FFFFFF" opacity="0.4"/>
  </g>
  <text x="358" y="176" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="70" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Gauss Elimination</text>
  <text x="360" y="230" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#A1A8B8">Solve linear systems Ax = b with partial pivoting in Python</text>
  <g>
    <rect x="360" y="276" width="117" height="40" rx="20" fill="#64748B" fill-opacity="0.10" stroke="#64748B" stroke-width="1"/>
    <text x="418" y="302" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#E5E7EB">Python 3</text>
    <rect x="491" y="276" width="178" height="40" rx="20" fill="#64748B" fill-opacity="0.10" stroke="#64748B" stroke-width="1"/>
    <text x="580" y="302" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#E5E7EB">Linear algebra</text>
    <rect x="683" y="276" width="199" height="40" rx="20" fill="#64748B" fill-opacity="0.10" stroke="#64748B" stroke-width="1"/>
    <text x="782" y="302" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#E5E7EB">Partial pivoting</text>
    <rect x="896" y="276" width="189" height="40" rx="20" fill="#64748B" fill-opacity="0.10" stroke="#64748B" stroke-width="1"/>
    <text x="990" y="302" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#E5E7EB">No dependencies</text>
  </g>
</svg>
